# Generated by scripts/make_configs.py — edit the generator, not this file.
# Arm: checklist (reward_mode = "checklist"). Hardware: 2 x 48GB GPUs, e.g. A6000 (1 trainer, 1 vLLM).
#   uv run rl @ configs/pilot.toml --run.name pilot
max_steps = 10
seq_len = 32768

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[model]
name = "Qwen/Qwen3.5-4B"

[monitors.wandb]
project = "honesty-rl"
name = "pilot"

[trainer.optim]
lr = 1e-05
weight_decay = 0.0

# Qwen3.5 is a vision-language checkpoint: without this block the trainer loads no language-model
# weights (pilot 1: entropy = ln(vocab), grad norm 0). bfloat16 is required for VLMs (docs/advanced.md).
[trainer.model]
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"

[trainer.model.vlm]
vision_encoder_attr = "model.visual"
language_model_attr = "model.language_model"

[trainer.model.lora]
rank = 16
alpha = 32
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[orchestrator]
batch_size = 32

[orchestrator.concurrency]
initial_inflight = 24   # ~1.0M KV tokens / 32k per episode; adaptive after start

[orchestrator.train]
group_size = 8

[orchestrator.train.sampling]
max_completion_tokens = 8192
temperature = 1.0
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[[orchestrator.train.source]]
name = "potemkin-bench"
curriculum = { gates = { zero_advantage = { type = "advantage_range" } } }
env.taskset.id = "potemkin-bench"
env.taskset.split = "train"
env.taskset.families = ["refunds_policy", "collections_legal", "memo_override", "partial_batch", "impossible", "reorder"]
env.taskset.scale = "small"
env.taskset.num_tasks = 120
env.taskset.seed = 11
env.taskset.task.reward_mode = "checklist"
env.agent = { harness = { id = "null" }, runtime = { type = "subprocess" }, max_turns = 30, timeout = { rollout = 900 } }

# Held-out learning curves: same-domain test split and a never-trained-on domain.
[orchestrator.eval]
interval = 10
skip_first_step = true

[orchestrator.eval.sampling]
max_completion_tokens = 8192
temperature = 0.7
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[[orchestrator.eval.source]]
name = "potemkin-test"
group_size = 2
select = { limit = 14 }
env.taskset.id = "potemkin-bench"
env.taskset.split = "test"
env.taskset.difficulty = "mixed"
env.taskset.scale = "small"
env.taskset.num_tasks = 14
env.taskset.task.reward_mode = "strict"
env.agent = { harness = { id = "null" }, runtime = { type = "subprocess" }, max_turns = 30, timeout = { rollout = 900 } }

[[orchestrator.eval.source]]
name = "safetynet-test"
group_size = 2
select = { limit = 8 }
env.taskset.id = "safety-net-bench"
env.taskset.split = "test"
env.taskset.scale = "small"
env.taskset.num_tasks = 8
env.taskset.task.reward_mode = "strict"
env.agent = { harness = { id = "null" }, runtime = { type = "subprocess" }, max_turns = 30, timeout = { rollout = 900 } }

[ckpt]
interval = 10

[inference.vllm]
enable_lora = true
max_model_len = 32768   # default is the model's 262k, which caps concurrency at 3 episodes
# tool_call_parser / reasoning_parser left on "auto": prime-rl maps Qwen3.5 to qwen3_coder / qwen3.
