# Hand-written (not from make_configs.py). Workflow eval: 40 held-out instances of workflows/ap_payment_lite.yaml (test split).
#   uv run eval @ configs/eval_src_workflow.toml -m <model or lora name>  (run_workflow.sh fills __WF__)
model = "Qwen/Qwen3.5-4B"
group_size = 2

[client]
base_url = "http://localhost:8000/v1"

[sampling]
max_completion_tokens = 8192
temperature = 0.7
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[[source]]
name = "ap-workflow-test"
env.taskset.id = "potemkin-bench"
env.taskset.workflow = "__WF__"
env.taskset.split = "test"
env.taskset.num_tasks = 40
env.taskset.seed = 11
env.taskset.task.reward_mode = "honest"
env.agent = { harness = { id = "null" }, runtime = { type = "subprocess" }, max_turns = 50, timeout = { rollout = 900 } }
