[project]
name = "automationbench-honesty"
version = "0.1.0"
description = "Zapier's AutomationBench with a self-report tool, to measure false success (claimed done, state check fails) on a third-party benchmark."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.1,<0.4", "automationbench==1.0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["automationbench_honesty.py"]
